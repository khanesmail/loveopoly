body{font-family:'Lato',sans-serif;}

.hearts {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}

.heart {
  position: absolute;
  animation: floatUp var(--d) linear infinite;
}

@keyframes floatUp {
  0% {
    transform: translate(0, 0) scale(0.8);
    opacity: 0;
  }
  15% {
    opacity: 0.25;
  }
  100% {
    transform: translate(var(--x), -150vh) scale(1.2);
    opacity: 0;
  }
}
.card-wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;background:#fff;border-radius:24px;box-shadow:0 8px 48px #e91e6322,0 2px 8px #00000010;border:1px solid #ffd6e7;overflow:hidden;padding-bottom:1rem;}

/* levels */

.level-label{font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#e91e63;margin-bottom:8px;}

.lvl-btn{padding:13px 8px 11px;border-radius:14px;border:2px solid #fce4ec;background:#fff;font-family:'Lato',sans-serif;font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;cursor:pointer;color:#c48090;transition:all 0.25s cubic-bezier(.34,1.3,.64,1);position:relative;overflow:hidden;}
.lvl-btn .lv-icon{display:block;font-size:20px;margin-bottom:5px;transition:transform 0.25s;}

.lvl-btn:hover{border-color:#f48fb1;color:#e91e63;transform:translateY(-2px);box-shadow:0 6px 16px #e91e6318;}
.lvl-btn .check{display:none;position:absolute;top:6px;right:8px;width:16px;height:16px;border-radius:50%;background:#e91e63;color:#fff;font-size:9px;align-items:center;justify-content:center;font-weight:900;}
.lvl-btn.active .check{display:flex;}
.lvl-btn.easy.active{background:linear-gradient(145deg,#fff0f8,#fce4ec);border-color:#f06292;color:#c2185b;transform:translateY(-3px) scale(1.04);box-shadow:0 0 0 4px #f4849455,0 8px 24px #e91e6330;}
.lvl-btn.easy.active .lv-icon{transform:scale(1.25);}
.lvl-btn.medium.active{background:linear-gradient(145deg,#fce4ec,#ffb3c6);border-color:#e91e63;color:#880e4f;transform:translateY(-3px) scale(1.04);box-shadow:0 0 0 4px #e91e6355,0 8px 24px #e91e6340;}
.lvl-btn.medium.active .lv-icon{transform:scale(1.25);}
.lvl-btn.hard.active{background:linear-gradient(145deg,#ffd6e7,#f48fb1);border-color:#c2185b;color:#560027;transform:translateY(-3px) scale(1.04);box-shadow:0 0 0 4px #c2185b66,0 8px 28px #c2185b55;}
.lvl-btn.hard.active .lv-icon{transform:scale(1.25);}

/* card decks — inside board center */
.decks-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:260px;margin:0 auto 10px;}
.deck-btn{border-radius:12px;border:2px dashed;padding:8px 6px;cursor:pointer;text-align:center;font-family:'Lato',sans-serif;font-weight:700;font-size:10px;letter-spacing:0.04em;transition:all 0.2s;position:relative;overflow:hidden;}
.deck-btn.twist{border-color:#ab47bc;background:#ffffffcc;color:#7b1fa2;}
.deck-btn.chest{border-color:#e91e63;background:#ffffffcc;color:#c2185b;}

.deck-btn.chest:hover{background:#fce4ec;}
.deck-icon{font-size:18px;display:block;margin-bottom:2px;}

.deck-btn.twist .deck-tag{background:#e1bee7;color:#6a1b9a;}
.deck-btn.chest .deck-tag{background:#fce4ec;color:#c2185b;}

.board-tile:disabled{cursor:default;opacity:0.9;}
.board-tile--filler{cursor:default;opacity:0.92;}
.board-tile--filler:hover{transform:none;filter:none;}
.board-tile.corner{border-radius:8px;box-shadow:inset 0 2px 0 #ffffff66,0 2px 8px #00000022;}
.board-tile.active{z-index:3;filter:brightness(1.08);}
.board-tile.active.easy{box-shadow:0 0 0 2px #fff,0 0 0 4px #f06292,0 4px 14px #00000033;}
.board-tile.active.medium{box-shadow:0 0 0 2px #fff,0 0 0 4px #e91e63,0 4px 14px #00000033;}
.board-tile.active.hard{box-shadow:0 0 0 2px #fff,0 0 0 4px #c2185b,0 4px 14px #00000033;}
.board-tile-inner{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px;padding:3px 2px;width:100%;height:100%;transform:rotate(var(--rot,0deg));}
.board-tile .box-num{font-size:7px;font-weight:800;letter-spacing:0.04em;opacity:0.85;margin:0;}
.board-tile .box-icon{font-size:clamp(11px,2.8vw,16px);line-height:1;margin:0;}
.board-tile .box-name{font-size:clamp(6px,1.65vw,9px);font-weight:800;line-height:1.15;text-transform:uppercase;letter-spacing:0.02em;margin:0;display:-webkit-box;-webkit-line-clamp:3;line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;max-width:100%;}

.board-center{grid-row:2/11;grid-column:2/11;z-index:1;background:linear-gradient(165deg,#fff8fb 0%,#fce4ec 45%,#f8bbd9 100%);border-radius:14px;border:2px solid #f48fb1;box-shadow:inset 0 0 24px #ffffff90;padding:8px 10px 10px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;min-height:0;overflow:hidden;}
.board-center-title{font-family:'Playfair Display',serif;font-size:clamp(15px,4.2vw,22px);font-weight:900;color:#212121;line-height:1.05;margin:2px 0 0;letter-spacing:-0.02em;}
.board-center-title .love{color:#e91e63;}
.board-center-sub{font-size:9px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#ad1457;margin:4px 0 6px;}
.board-center .level-wrap{width:100%;max-width:280px;margin-bottom:6px;}
.board-center .level-row{margin-bottom:0;}
.board-center .lvl-btn{padding:8px 4px 6px;font-size:9px;border-radius:10px;}
.board-center .lvl-btn .lv-icon{font-size:15px;margin-bottom:2px;}

.panel{border-radius:14px;border:2px solid #fce4ec;background:linear-gradient(145deg,#ffffffee,#fff5f8);padding:10px 10px 12px;min-height:0;flex:1;width:100%;max-width:100%;transition:border-color 0.3s,box-shadow 0.3s;position:relative;overflow:auto;display:flex;flex-direction:column;}
.panel.easy{border-color:#f06292;box-shadow:0 4px 20px #e91e6314;}
.panel.medium{border-color:#e91e63;box-shadow:0 4px 20px #e91e6322;}
.panel.hard{border-color:#c2185b;box-shadow:0 6px 28px #c2185b33;}

.placeholder p{font-size:12px;font-style:italic;line-height:1.4;}
.panel-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:9px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:6px;background:#fce4ec;color:#e91e63;border:1px solid #f48fb1;}
.panel-box-name{font-family:'Playfair Display',serif;font-size:15px;font-weight:700;color:#880e4f;margin-bottom:6px;line-height:1.2;}
.tag{display:inline-block;padding:4px 12px;border-radius:99px;font-size:10px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:10px;border:1.5px solid transparent;}
.tag-go{background:#e8f5e9;border-color:#66bb6a;color:#2e7d32;}
.tag-back{background:#fce4ec;border-color:#e91e63;color:#c2185b;}
.tag-skip{background:#fff3e0;border-color:#ffa726;color:#e65100;}
.tag-bonus{background:#f3e5f5;border-color:#ab47bc;color:#6a1b9a;}
.panel-action{font-size:13px;color:#5d4037;line-height:1.6;font-style:italic;transition:opacity 0.15s;}
.panel-action.flash{opacity:0;}
.edit-row{display:flex;flex-direction:column;gap:6px;margin-top:8px;padding-top:8px;border-top:1.5px dashed #fce4ec;}
@media (min-width:380px){.edit-row{flex-direction:row;align-items:center;}}
.edit-row input{flex:1;padding:6px 12px;background:#fff5f8;border:1.5px solid #fce4ec;border-radius:50px;color:#880e4f;font-family:'Lato',sans-serif;font-size:12px;outline:none;transition:border-color 0.2s;min-width:0;}

/* Modal */
.modal-bg{display:none;position:fixed;inset:0;background:#00000066;z-index:100;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
.modal-bg.open{display:flex;}
.modal{background:#fff;border-radius:24px;width:min(380px,92vw);overflow:hidden;box-shadow:0 24px 64px #00000033;animation:popIn 0.3s cubic-bezier(.34,1.4,.64,1);}
@keyframes popIn{from{transform:scale(0.7) translateY(30px);opacity:0;}to{transform:scale(1) translateY(0);opacity:1;}}

.modal-level-pill{display:inline-block;margin-top:8px;padding:3px 12px;border-radius:99px;background:#ffffff30;color:#fff;font-size:10px;font-weight:700;letter-spacing:0.08em;}

.modal-btns{display:flex;gap:8px;padding:0 1.25rem 1.25rem;}

.close-btn{padding:11px 18px;border-radius:50px;border:1.5px solid #fce4ec;background:#fff;font-family:'Lato',sans-serif;font-size:12px;font-weight:700;color:#c48090;cursor:pointer;}
.close-btn:hover{background:#fce4ec;color:#e91e63;}
</style>

function buildBoardPath(){
  const p=[];
  // Start at bottom-right (Love Start), then go clockwise
  for(let c=11;c>=1;c--) p.push({r:11,c});      // bottom row: right -> left
  for(let r=10;r>=1;r--) p.push({r,c:1});       // left col: bottom -> top
  for(let c=2;c<=11;c++) p.push({r:1,c});       // top row: left -> right
  for(let r=2;r<=10;r++) p.push({r,c:11});      // right col: top -> bottom
  return p;
}

const hc = document.getElementById('hearts');

const emojis = ['❤️','💕','💗','💖','💝','🌹','💋'];
const maxHearts = 20;   // limit total on screen

function createHeart() {
  if (currentHearts >= maxHearts) return;

  const d = document.createElement('div');
  d.className = 'heart';
  d.textContent = emojis[Math.floor(Math.random() * emojis.length)];

  const left = 5 + Math.random() * 90;
  const duration = 6 + Math.random() * 6;
  const drift = Math.random() * 100 - 50;
  const size = 12 + Math.random() * 12;
  const opacity = (0.1 + Math.random() * 0.25).toFixed(2);

  d.style.cssText = `
    left:${left}%;
    bottom:-20px;
    font-size:${size}px;
    opacity:${opacity};
    --d:${duration}s;
    --delay:0s;
    --x:${drift}px;
  `;

  hc.appendChild(d);
  currentHearts++;

  // remove after animation ends
  setTimeout(() => {
    d.remove();
    currentHearts--;
  }, duration * 1000);
}

// create hearts slowly over time

 //     inner.innerHTML='<div class="box-num">#'+String(id).padStart(2,'0')+'</div><div class="box-icon">'+b.e+'</div><div class="box-name">'+escapeHtml(b.n)+'</div>';
      inner.innerHTML='<div class="box-num">#'+String(id).padStart(2,'0')+'</div><div class="box-icon">'+b.e+'</div>';
      btn.appendChild(inner);
      frag.appendChild(btn);
    }else{
      const div=document.createElement('div');
      div.className='board-tile board-tile--filler'+(isCorner?' corner':'');
      div.style.gridRow=String(r);
      div.style.gridColumn=String(c);
      div.style.background='linear-gradient(160deg,#ba68c8,#6a1b9a)';
      const inner=document.createElement('div');
      inner.className='board-tile-inner';
      inner.style.setProperty('--rot',rot);
      inner.innerHTML='<div class="box-icon">✨</div><div class="box-name">Free<br>space</div>';
      div.appendChild(inner);
      frag.appendChild(div);
    }
  });
  board.insertBefore(frag,board.firstChild);
}

}

function drawCard(){
  const deck=currentCardType==='twist'?LOVE_TWIST[level]:COUPLE_CHEST[level];

  const card=deck[randomIndexes[deckcounter]];

  cardEl.style.animation='cardFlip 0.4s ease-out';

  document.getElementById('cardText').textContent=card.text;

}
