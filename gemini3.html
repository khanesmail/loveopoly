<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Loveopoly – Couple Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#e91e63;--pink-light:#f48fb1;--pink-dark:#c2185b;--pink-pale:#fce4ec;
  --purple:#7b1fa2;--purple-light:#ab47bc;
  --cream:#fff8fb;--white:#fff;
  --text:#3a1a2a;--text-soft:#9a6070;
  --radius:18px;--radius-sm:12px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}

body{
  font-family:'Nunito',sans-serif;
  background:var(--cream);
  display:flex;flex-direction:column;
}

/* ── LAYOUT WRAPPER (RESPONSIVE) ── */
.layout-wrapper {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  width: 100vw;
  overflow: hidden;
}

/* ── TOP UI DASHBOARD (Title & Level Selector Side-by-Side) ── */
.top-ui {
  background: linear-gradient(160deg,#fff8fb,#fce4ec 60%,#f8bbd9);
  padding: 8px 12px;
  border-bottom: 2px solid #f48fb1;
  box-shadow: 0 4px 16px rgba(233, 30, 99, 0.1);
  z-index: 10;
  flex-shrink: 0;
  width: 100%;
}
.top-ui-inner {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  width: 100%;
  max-width: 900px;
  margin: 0 auto;
}
.top-ui-header {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  padding-right: 4px;
}
.center-title{font-family:'Playfair Display',serif;font-size:clamp(16px, 5vw, 28px);font-weight:900;color:#212121;line-height:1;letter-spacing:-0.02em;text-align:center;}
.center-title .love{color:var(--pink);}
.center-sub{font-size:clamp(7px, 2vw, 10px);font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#ad1457;line-height:1;margin-top:4px;}

.center-levels {
  display: flex;
  flex-direction: row;
  flex: 1;
  gap: 4px;
  justify-content: flex-end;
  max-width: 400px;
}
.clvl{
  padding:5px 2px;border-radius:10px;border:1.5px solid transparent;
  background:#fff;font-family:'Nunito',sans-serif;font-size:clamp(8px, 2.5vw, 12px);font-weight:900;
  letter-spacing:0.04em;text-transform:uppercase;cursor:pointer;
  color:#c48090;transition:all 0.2s cubic-bezier(.34,1.3,.64,1);
  display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;
  flex: 1; max-width: 90px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.04);
}
.clvl .ci{font-size:clamp(14px, 4vw, 20px);line-height:1;}
.clvl .ck{display:none;position:absolute;top:2px;right:2px;width:12px;height:12px;border-radius:50%;background:var(--pink);color:#fff;font-size:8px;align-items:center;justify-content:center;font-weight:900;}
.clvl.active .ck{display:flex;}
.clvl.easy.active{background:linear-gradient(145deg,#fff0f8,#fce4ec);border-color:#f06292;color:#c2185b;transform:scale(1.05);box-shadow:0 2px 8px #f4849455;}
.clvl.medium.active{background:linear-gradient(145deg,#fce4ec,#ffb3c6);border-color:var(--pink);color:#880e4f;transform:scale(1.05);box-shadow:0 2px 8px #e91e6355;}
.clvl.hard.active{background:linear-gradient(145deg,#ffd6e7,#f48fb1);border-color:var(--pink-dark);color:#560027;transform:scale(1.05);box-shadow:0 2px 8px #c2185b66;}

/* ── BOARD AREA (5x8 GRID) ── */
.board-section{
  flex:1;
  overflow-y:auto; /* Allows scrolling if board is tall */
  padding:16px;
  display:flex;
  align-items:flex-start; /* Ensure scrolling works properly */
  justify-content:center;
}
.board{
  display:grid;
  grid-template-columns: repeat(5, 1fr);
  grid-template-rows: repeat(8, 1fr);
  gap:4px;
  width:100%;
  max-width: 600px;
  background:linear-gradient(145deg,#ad1457,#880e4f);
  padding:6px;border-radius:16px;
  box-shadow:0 8px 32px #880e4f44,inset 0 1px 0 #ffffff22;
}
.tile{
  min-width:0;min-height:0;border:none;border-radius:6px;
  cursor:pointer;padding:2px;display:flex;align-items:center;justify-content:center;
  transition:transform 0.15s,box-shadow 0.12s;
  box-shadow:inset 0 1px 0 #ffffff44;
  position:relative;
  -webkit-user-select:none;user-select:none;
  aspect-ratio: 1; /* Makes tiles perfectly square */
}
.tile:active{transform:scale(0.93);}
.tile.active{z-index:5;}
.tile.active.easy{box-shadow:0 0 0 2px #fff,0 0 0 3.5px #f06292,0 3px 12px #00000055;}
.tile.active.medium{box-shadow:0 0 0 2px #fff,0 0 0 3.5px #e91e63,0 3px 12px #00000055;}
.tile.active.hard{box-shadow:0 0 0 2px #fff,0 0 0 3.5px #c2185b,0 3px 12px #00000055;}
.tile-inner{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;gap:2px;width:100%;height:100%;
  pointer-events:none;
}
.tile .tnum{font-size:clamp(12px, 4vw, 18px);font-weight:900;letter-spacing:0.03em;color:#ffffffcc;margin:0;line-height:1;}
.tile .ticon{font-size:clamp(16px, 5vw, 32px);line-height:1;margin:0;color:#ffffffcc;}

/* ── BOTTOM SHEET (CENTERED MODAL) ── */
.bs-backdrop {
  position: fixed; inset: 0; background: #00000077; z-index: 90;
  backdrop-filter: blur(4px);
  opacity: 0; visibility: hidden; transition: all 0.32s cubic-bezier(.32,0.72,0,1);
}
.bs-backdrop.open {
  opacity: 1; visibility: visible;
}
.bottom-sheet{
  position:fixed;top:50%;left:50%;
  width:calc(100% - 32px);
  max-width: 500px;
  background:#fff;border-radius:24px;
  box-shadow:0 12px 48px rgba(233, 30, 99, 0.2);
  transform:translate(-50%, -40%) scale(0.95);
  opacity:0;visibility:hidden;
  transition:all 0.32s cubic-bezier(.32,0.72,0,1);
  z-index:95;padding:0 0 20px;
  max-height:85vh;display:flex;flex-direction:column;
}
.bottom-sheet.open{
  transform:translate(-50%, -50%) scale(1);
  opacity:1;visibility:visible;
}
.bs-handle{display:none;}
.bs-content{padding:28px 24px 8px;flex:1;overflow-y:auto;text-align:center;}
.bs-badge{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:99px;font-size:11px;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:10px;background:#fce4ec;color:var(--pink);border:1px solid #f48fb1;}
.bs-name{font-family:'Playfair Display',serif;font-size:24px;font-weight:700;color:#880e4f;margin-bottom:8px;}
.bs-tag{display:inline-block;padding:4px 12px;border-radius:99px;font-size:11px;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:12px;border:1.5px solid transparent;}
.tag-go{background:#e8f5e9;border-color:#66bb6a;color:#2e7d32;}
.tag-back{background:#fce4ec;border-color:var(--pink);color:var(--pink-dark);}
.tag-skip{background:#fff3e0;border-color:#ffa726;color:#e65100;}
.tag-bonus{background:#f3e5f5;border-color:var(--purple-light);color:var(--purple);}
.bs-action{font-size:18px;color:#5d4037;line-height:1.6;font-style:italic;margin-bottom:14px;transition:opacity 0.12s;}
.bs-action.flash{opacity:0;}
.bs-close{position:absolute;top:14px;right:18px;width:32px;height:32px;border-radius:50%;background:#fce4ec;border:none;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;color:var(--pink);font-weight:900;}

/* ── MODAL ── */
.modal-bg{display:none;position:fixed;inset:0;background:#00000077;z-index:100;align-items:center;justify-content:center;backdrop-filter:blur(4px);padding:16px;}
.modal-bg.open{display:flex;}
.modal{
  background:#fff;border-radius:24px;
  width:100%;max-width:400px;max-height:85vh;
  overflow:hidden;display:flex;flex-direction:column;
  animation:popIn 0.32s cubic-bezier(.32,0.72,0,1);
  position: relative;
}
@keyframes popIn{from{transform:scale(0.95);opacity:0;}to{transform:scale(1);opacity:1;}}
.modal-handle{display:none;}
.modal-close{position:absolute;top:12px;right:16px;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,0.25);border:none;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;transition:background 0.2s;}
.modal-close:active{background:rgba(255,255,255,0.4);}
.modal-header{padding:14px 16px 12px;text-align:center;flex-shrink:0;}
.modal-header.twist{background:linear-gradient(135deg,var(--purple),var(--purple-light),#ce93d8);}
.modal-header.chest{background:linear-gradient(135deg,var(--pink-dark),var(--pink),var(--pink-light));}
.modal-header h2{font-family:'Playfair Display',serif;font-size:20px;color:#fff;font-weight:900;}
.modal-header p{font-size:11px;color:#fff9;margin-top:2px;letter-spacing:0.1em;text-transform:uppercase;}
.modal-level-pill{display:inline-block;margin-top:7px;padding:3px 12px;border-radius:99px;background:#ffffff30;color:#fff;font-size:10px;font-weight:800;letter-spacing:0.07em;}
.modal-card-area{padding:16px;flex:1;overflow-y:auto;}
.drawn-card{border-radius:16px;padding:16px;border:2px dashed;font-style:italic;font-size:16px;line-height:1.5;color:#5d4037;animation:cardFlip 0.38s ease-out;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;min-height:200px;}
.drawn-card.twist{background:#f9f0ff;border-color:var(--purple-light);}
.drawn-card.chest{background:#fff0f5;border-color:var(--pink);}
@keyframes cardFlip{from{transform:rotateY(80deg);opacity:0;}to{transform:rotateY(0);opacity:1;}}
.card-no{font-size:10px;font-weight:900;letter-spacing:0.1em;opacity:0.5;text-transform:uppercase;}
.card-icon{font-size:32px;line-height:1;}
.modal-btns{display:flex;gap:10px;padding:0 16px 16px;flex-shrink:0;}
.draw-again-btn{flex:1;padding:13px;border-radius:50px;border:none;font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;letter-spacing:0.05em;cursor:pointer;transition:all 0.18s;}
.draw-again-btn.twist{background:linear-gradient(135deg,var(--purple),var(--purple-light));color:#fff;}
.draw-again-btn.chest{background:linear-gradient(135deg,var(--pink-dark),var(--pink));color:#fff;}
.draw-again-btn:active{transform:scale(0.97);}

/* hearts bg */
.hearts-bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;}
.hbg{position:absolute;animation:hbgfloat linear infinite;opacity:0.08;}

@keyframes hbgfloat{
  0%{transform:translateY(0) rotate(0deg);opacity:0;}
  10%{opacity:0.15;}
  90%{opacity:0.1;}
  100%{transform:translateY(-110vh) rotate(360deg);opacity:0;}
}

/* ── DESKTOP & LANDSCAPE MEDIA QUERIES ── */
@media (min-width: 768px), (orientation: landscape) and (max-height: 600px) {
  .board-section {
    padding: 24px;
    align-items: center; /* center vertically on larger screens */
  }
  .board {
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(5, 1fr);
    max-width: 700px; /* Reduced for smaller boxes on laptop view */
    margin: 0 auto;
  }
}
</style>
</head>

<!-- CARD MODAL -->
<div class="modal-bg" id="modalBg" onclick="closeModal(event)">

const LEVEL_LABEL={easy:'🌸 Soft Play',medium:'💋 Flirty',hard:'🔥 Spicy'};
function tagLabel(t){return{go:'Move Forward',back:'Go Back',skip:'Skip Turn',bonus:'Challenge',card:'Draw a Card'}[t]||'Action';}
function tagClass(t){return{go:'tag-go',back:'tag-back',skip:'tag-skip',bonus:'tag-bonus',card:'tag-bonus'}[t]||'tag-bonus';}

  const dur=8+Math.random()*10;
  d.style.cssText=`left:${Math.random()*95}%;bottom:-30px;font-size:${14+Math.random()*16}px;animation-duration:${dur}s;animation-delay:${-Math.random()*dur}s;`;
  hbg.appendChild(d);
});

let currentCols = 5;

// Render the responsive solid grid natively with JS
function renderBoard(){
  const board=document.getElementById('board');
  board.innerHTML = '';
  const frag=document.createDocumentFragment();

  // Detect if Desktop layout is active to set columns dynamically
  const isDesktop = window.matchMedia("(min-width: 768px), (orientation: landscape) and (max-height: 600px)").matches;
  const cols = isDesktop ? 8 : 5;
  const rows = 40 / cols; // Calculate total rows (8 for mobile, 5 for desktop)
  currentCols = cols;

  BOXES.forEach((b, i) => {
    const id=i+1;
    const btn=document.createElement('button');
    btn.type='button';
    btn.className='tile '+(selectedId===id?' active '+level:'');
    
    // Snake and Ladder logic starting at Bottom Right
    const rowFromBottom = Math.floor(i / cols); // 0 corresponds to the very bottom row
    const r = rows - rowFromBottom; // Calculates CSS grid row starting from the bottom
    
    // Alternates between Right-to-Left and Left-to-Right
    const c = (rowFromBottom % 2 === 0) ? cols - (i % cols) : (i % cols) + 1; 
    
    btn.style.gridRow = String(r);
    btn.style.gridColumn = String(c);

    const bg=TILE_BGS[i]||'#e91e63';
    btn.style.background=`linear-gradient(160deg,${bg} 0%,rgba(0,0,0,0.28) 100%)`;
    btn.addEventListener('click',()=>selectBox(id));
    
    const inner=document.createElement('div');
    inner.className='tile-inner';
    inner.innerHTML=`<div class="tnum">#${String(id).padStart(2,'0')}</div><div class="ticon">${b.e}</div>`;
    btn.appendChild(inner);
    frag.appendChild(btn);
  });
  
  board.appendChild(frag);
}

function setLevel(l){
  selectedId=null;
  level=l;
  //randomIndexes=[]; // Reset cards when changing difficulty
  document.querySelectorAll('.lvl-btn,.clvl').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.lvl-btn.'+l+',.clvl.'+l).forEach(b=>b.classList.add('active'));
  renderBoard(); // Drop highlight when switching levels
}

function selectBox(id){
  selectedId=id;
  renderBoard(); // refresh active highlight
  const entry=ACTIONS[level][selectedId-1];
  const box=BOXES[selectedId-1];
  renderBottomSheet(box,entry);
  openBottomSheet();
}

function renderBottomSheet(box,entry){
  const content=document.getElementById('bsContent');
  const lvlLabel=LEVEL_LABEL[level];
  if(entry.t==='card'){
    const isChest=entry.ct==='chest';
    content.innerHTML=`<div class="bs-badge">❤ ${lvlLabel} · Box #${selectedId}</div>
      <div class="bs-name">${box.e} ${box.n}</div>
      <div><span class="bs-tag tag-bonus">Draw a Card</span></div>
      <div class="bs-action">${isChest?'You landed on the Couple Chest!':'You landed on Love Twist!'}</div>
      <button onclick="openCardModal('${entry.ct}');closeBottomSheet();" style="width:100%;padding:16px;border-radius:50px;border:none;background:linear-gradient(135deg,${isChest?'#c2185b,#e91e63':'#7b1fa2,#ab47bc'});color:#fff;font-family:'Nunito',sans-serif;font-size:16px;font-weight:800;cursor:pointer;letter-spacing:0.04em;margin-top:8px;">
        ${isChest?'💝 Open the Couple Chest':'🃏 Draw a Love Twist Card'}
      </button>`;
  } else {
    content.innerHTML=`<div class="bs-badge">❤ ${lvlLabel} · Box #${selectedId}</div>
      <div class="bs-name">${box.e} ${box.n}</div>
      <div><span class="bs-tag ${tagClass(entry.t)}">${tagLabel(entry.t)}</span></div>
      <div class="bs-action">${entry.a}</div>`;
  }
}

function openBottomSheet(){
  document.getElementById('bottomSheet').classList.add('open');
  document.getElementById('bsBackdrop').classList.add('open');
}
function closeBottomSheet(){
  document.getElementById('bottomSheet').classList.remove('open');
  document.getElementById('bsBackdrop').classList.remove('open');
}

// swipe down to close bottom sheet
let bsStartY=0;
const bs=document.getElementById('bottomSheet');
bs.addEventListener('touchstart',e=>{bsStartY=e.touches[0].clientY;},{passive:true});
bs.addEventListener('touchend',e=>{if(e.changedTouches[0].clientY-bsStartY>60) closeBottomSheet();},{passive:true});

function openCardModal(type){
  if(currentCardType !== type) {
    currentCardType = type;
   // randomIndexes = []; // Force reshuffle when changing deck types
  }

  
  const isChest=type==='chest';
  const header=document.getElementById('modalHeader');
  header.className='modal-header '+(isChest?'chest':'twist');
  document.getElementById('modalTitle').textContent=isChest?'💝 Couple Chest':'🃏 Love Twist';
  document.getElementById('modalSub').textContent=isChest?'Open the chest to claim your reward':'A surprise twist for the couple';
  document.getElementById('modalLevelPill').textContent=LEVEL_LABEL[level];
  document.getElementById('drawnCard').className='drawn-card '+(isChest?'chest':'twist');
  
  // FIX: Restore the color styling to the Draw Again button
  const drawAgainBtn = document.getElementById('drawAgainBtn');
  if (drawAgainBtn) {
    drawAgainBtn.className = 'draw-again-btn ' + (isChest ? 'chest' : 'twist');
  }
  
  drawCard();
  document.getElementById('modalBg').classList.add('open');
}

function drawCard(){
  const deck=currentCardType==='twist'?LOVE_TWIST[level]:COUPLE_CHEST[level];
  if(deckcounter>=deck.length){
    randomIndexes=Array.from({length:deck.length},(_,i)=>i).sort(()=>Math.random()-0.5);
	 console.log("reset");
    console.log(randomIndexes);
    deckcounter=0;
  }
  const card=deck[randomIndexes[deckcounter++]];
  const cardEl=document.getElementById('drawnCard');
  cardEl.style.animation='none';cardEl.offsetHeight;cardEl.style.animation='cardFlip 0.38s ease-out';
  
  document.getElementById('cardNo').textContent="CARD #"+card.no;
  document.getElementById('cardIcon').textContent=card.icon;
  document.getElementById('cardText').textContent=card.text;
  document.getElementById('modalLevelPill').textContent=LEVEL_LABEL[level];
}

function closeModal(e){
  if(!e||e.target===document.getElementById('modalBg'))
    document.getElementById('modalBg').classList.remove('open');
}

renderBoard();

// Re-render board if switching between desktop (8 cols) and mobile (5 cols) dynamically
window.addEventListener('resize', () => {
  const isDesktop = window.matchMedia("(min-width: 768px), (orientation: landscape) and (max-height: 600px)").matches;
  const newCols = isDesktop ? 8 : 5;
  if (newCols !== currentCols) renderBoard();
});
