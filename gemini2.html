<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Loveopoly – Couple Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#e91e63;--pink-light:#f48fb1;--pink-dark:#c2185b;--pink-pale:#fce4ec;
  --purple:#7b1fa2;--purple-light:#ab47bc;
  --cream:#fff8fb;--white:#fff;
  --text:#3a1a2a;--text-soft:#9a6070;
  --radius:18px;--radius-sm:12px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}

body{
  font-family:'Nunito',sans-serif;
  background:var(--cream);
}

/* ── LAYOUT WRAPPER (RESPONSIVE) ── */
.layout-wrapper {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  width: 100vw;
  overflow: hidden;
}

/* ── BOARD AREA ── */
.board-section{
  flex:1;
  min-height: 0;
  overflow:hidden;
  padding:12px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.board{
  display:grid;
  grid-template-columns:1.15fr repeat(9,1fr) 1.15fr;
  grid-template-rows:1.15fr repeat(9,1fr) 1.15fr;
  gap:2px;
  width:100%;
  max-width: min(100vw - 24px, 100vh - 24px);
  aspect-ratio:1;
  background:linear-gradient(145deg,#ad1457,#880e4f);
  padding:4px;border-radius:16px;
  box-shadow:0 8px 32px #880e4f44,inset 0 1px 0 #ffffff22;
}
.tile{
  min-width:0;min-height:0;border:none;border-radius:5px;
  cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;
  transition:transform 0.15s,box-shadow 0.12s;
  box-shadow:inset 0 1px 0 #ffffff44;
  position:relative;
  -webkit-user-select:none;user-select:none;
}
.tile:active:not(.filler){transform:scale(0.93);}
.tile.filler{cursor:default;opacity:0.88;}
.tile.corner{border-radius:7px;box-shadow:inset 0 2px 0 #ffffff55;}
.tile.active{z-index:3;}
.tile.active.easy{box-shadow:0 0 0 2px #fff,0 0 0 3.5px #f06292,0 3px 12px #00000033;}
.tile.active.medium{box-shadow:0 0 0 2px #fff,0 0 0 3.5px #e91e63,0 3px 12px #00000033;}
.tile.active.hard{box-shadow:0 0 0 2px #fff,0 0 0 3.5px #c2185b,0 3px 12px #00000033;}
.tile-inner{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;gap:1px;padding:2px 1px;width:100%;height:100%;
  transform:rotate(var(--rot,0deg));pointer-events:none;
}
.tile .tnum{font-size:clamp(7px, 1.2vmin, 14px);font-weight:900;letter-spacing:0.03em;color:#ffffffcc;margin:0;line-height:1;}
.tile .ticon{font-size:clamp(12px, 3vmin, 32px);line-height:1;margin:0;}

/* board center */
.board-center{
  grid-row:2/11;grid-column:2/11;z-index:1;
  background:linear-gradient(160deg,#fff8fb,#fce4ec 60%,#f8bbd9);
  border-radius:12px;border:1.5px solid #f48fb1;
  box-shadow:inset 0 0 18px #ffffff80;
  padding:6px 8px 8px;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  overflow:hidden;gap:5px;
}
.center-title{font-family:'Playfair Display',serif;font-size:clamp(14px, 4vmin, 36px);font-weight:900;color:#212121;line-height:1;letter-spacing:-0.02em;text-align:center;}
.center-title .love{color:var(--pink);}
.center-sub{font-size:clamp(7px, 1.5vmin, 14px);font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#ad1457;line-height:1;}

/* mini level in center */
.center-levels{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;width:100%;}
.clvl{
  padding:4px 2px 3px;border-radius:7px;border:1.5px solid #fce4ec;
  background:#fff9fb;font-family:'Nunito',sans-serif;font-size:clamp(7.5px, 1.5vmin, 14px);font-weight:900;
  letter-spacing:0.04em;text-transform:uppercase;cursor:pointer;
  color:#c48090;transition:all 0.2s cubic-bezier(.34,1.3,.64,1);
  display:flex;flex-direction:column;align-items:center;gap:1px;position:relative;
}
.clvl .ci{font-size:clamp(12px, 2.5vmin, 20px);line-height:1;}
.clvl .ck{display:none;position:absolute;top:2px;right:3px;width:10px;height:10px;border-radius:50%;background:var(--pink);color:#fff;font-size:6px;align-items:center;justify-content:center;font-weight:900;}
.clvl.active .ck{display:flex;}
.clvl.easy.active{background:linear-gradient(145deg,#fff0f8,#fce4ec);border-color:#f06292;color:#c2185b;transform:scale(1.05);box-shadow:0 0 0 2px #f4849455;}
.clvl.medium.active{background:linear-gradient(145deg,#fce4ec,#ffb3c6);border-color:var(--pink);color:#880e4f;transform:scale(1.05);box-shadow:0 0 0 2px #e91e6355;}
.clvl.hard.active{background:linear-gradient(145deg,#ffd6e7,#f48fb1);border-color:var(--pink-dark);color:#560027;transform:scale(1.05);box-shadow:0 0 0 2px #c2185b66;}

/* mini decks in center */
.center-decks{display:grid;grid-template-columns:1fr 1fr;gap:3px;width:100%;}
.cdeck{
  border-radius:7px;border:1.5px dashed;padding:4px 4px 3px;
  cursor:pointer;text-align:center;font-family:'Nunito',sans-serif;
  font-weight:800;font-size:clamp(7px, 1.5vmin, 14px);letter-spacing:0.04em;
  display:flex;flex-direction:column;align-items:center;gap:1px;
  -webkit-user-select:none;user-select:none;transition:all 0.15s;
}
.cdeck:active{transform:scale(0.94);}
.cdeck.twist{border-color:var(--purple-light);background:#f9f0ffcc;color:var(--purple);}
.cdeck.chest{border-color:var(--pink);background:#fff0f5cc;color:var(--pink-dark);}
.cdeck .cdi{font-size:clamp(14px, 3vmin, 24px);line-height:1;}
.cdeck .cdt{padding:1px 5px;border-radius:99px;font-size:clamp(6px, 1.2vmin, 12px);font-weight:900;margin-top:1px;}
.cdeck.twist .cdt{background:#e1bee7;color:#6a1b9a;}
.cdeck.chest .cdt{background:#fce4ec;color:var(--pink-dark);}

/* action panel inside center */
.center-panel{
  border-radius:9px;border:1.5px solid #fce4ec;
  background:linear-gradient(145deg,#ffffffee,#fff5f8);
  padding:7px 8px 8px;flex:1;width:100%;
  display:flex;flex-direction:column;overflow:hidden;
  transition:border-color 0.25s,box-shadow 0.25s;
  min-height:0;
}
.center-panel.easy{border-color:#f06292;box-shadow:0 2px 10px #e91e6314;}
.center-panel.medium{border-color:var(--pink);box-shadow:0 2px 10px #e91e6320;}
.center-panel.hard{border-color:var(--pink-dark);box-shadow:0 3px 14px #c2185b33;}
.ph{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;color:#d4a0b0;text-align:center;gap:3px;padding:4px;}
.ph span{font-size:clamp(20px, 4vmin, 40px);}
.ph p{font-size:clamp(10px, 2vmin, 18px);font-style:italic;line-height:1.4;color:#c4a0b8;}
.pbadge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:99px;font-size:clamp(8px, 1.5vmin, 14px);font-weight:800;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:4px;background:#fce4ec;color:var(--pink);border:1px solid #f48fb1;white-space:nowrap;}
.pbox{font-family:'Playfair Display',serif;font-size:clamp(12px,3vw,22px);font-weight:700;color:#880e4f;margin-bottom:4px;line-height:1.2;}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:clamp(8px, 1.5vmin, 14px);font-weight:800;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:5px;border:1.5px solid transparent;}
.tag-go{background:#e8f5e9;border-color:#66bb6a;color:#2e7d32;}
.tag-back{background:#fce4ec;border-color:var(--pink);color:var(--pink-dark);}
.tag-skip{background:#fff3e0;border-color:#ffa726;color:#e65100;}
.tag-bonus{background:#f3e5f5;border-color:var(--purple-light);color:var(--purple);}
.paction{font-size:clamp(11px,2.5vw,20px);color:#5d4037;line-height:1.55;font-style:italic;flex:1;overflow-y:auto;transition:opacity 0.12s;}
.paction.flash{opacity:0;}

/* ── BOTTOM SHEET (NOW CENTERED) ── */
.bs-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 90;
  opacity: 0; visibility: hidden; transition: all 0.32s cubic-bezier(.32,0.72,0,1);
}
.bs-backdrop.open {
  opacity: 1; visibility: visible;
}
.bottom-sheet{
  position:fixed;top:50%;left:50%;
  width:calc(100% - 32px);
  max-width: 400px;
  background:#fff;border-radius:24px;
  box-shadow:0 12px 48px rgba(233, 30, 99, 0.2);
  transform:translate(-50%, -40%) scale(0.95);
  opacity:0;visibility:hidden;
  transition:all 0.32s cubic-bezier(.32,0.72,0,1);
  z-index:100;padding:0 0 16px;
  max-height:85vh;display:flex;flex-direction:column;
}
.bottom-sheet.open{
  transform:translate(-50%, -50%) scale(1);
  opacity:1;visibility:visible;
}
.bs-handle{display:none;}
.bs-content{padding:24px 20px 4px;flex:1;overflow-y:auto;}
.bs-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-size:10px;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:8px;background:#fce4ec;color:var(--pink);border:1px solid #f48fb1;}
.bs-name{font-family:'Playfair Display',serif;font-size:19px;font-weight:700;color:#880e4f;margin-bottom:6px;}
.bs-tag{display:inline-block;padding:3px 11px;border-radius:99px;font-size:10px;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:10px;border:1.5px solid transparent;}
.bs-action{font-size:15px;color:#5d4037;line-height:1.7;font-style:italic;margin-bottom:10px;transition:opacity 0.12s;}
.bs-action.flash{opacity:0;}
.bs-close{position:absolute;top:12px;right:16px;width:28px;height:28px;border-radius:50%;background:#fce4ec;border:none;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;color:var(--pink);font-weight:900;}

/* ── MODAL (NOW CENTERED) ── */
.modal-bg{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);
  z-index:100;align-items:center;justify-content:center;
  backdrop-filter:blur(4px);padding: 16px;
}
.modal-bg.open{display:flex;}
.modal{
  background:#fff;border-radius:24px;
  width:100%;max-width: 400px;max-height:85vh;
  margin: 0 auto;
  overflow:hidden;display:flex;flex-direction:column;
  animation:popIn 0.32s cubic-bezier(.32,0.72,0,1);
  position: relative;
}
@keyframes popIn{from{transform:scale(0.95);opacity:0;}to{transform:scale(1);opacity:1;}}
.modal-handle{display:none;}
.modal-close{position:absolute;top:12px;right:16px;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,0.25);border:none;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;transition:background 0.2s;}
.modal-close:active{background:rgba(255,255,255,0.4);}
.modal-header{padding:14px 16px 12px;text-align:center;flex-shrink:0;}
.modal-header.twist{background:linear-gradient(135deg,var(--purple),var(--purple-light),#ce93d8);}
.modal-header.chest{background:linear-gradient(135deg,var(--pink-dark),var(--pink),var(--pink-light));}
.modal-header h2{font-family:'Playfair Display',serif;font-size:20px;color:#fff;font-weight:900;}
.modal-header p{font-size:11px;color:#fff9;margin-top:2px;letter-spacing:0.1em;text-transform:uppercase;}
.modal-level-pill{display:inline-block;margin-top:7px;padding:3px 12px;border-radius:99px;background:#ffffff30;color:#fff;font-size:10px;font-weight:800;letter-spacing:0.07em;}
.modal-card-area{padding:16px;flex:1;overflow-y:auto;}
.drawn-card{border-radius:16px;padding:20px 16px;border:2px dashed;font-style:italic;font-size:17px;line-height:1.7;color:#5d4037;animation:cardFlip 0.38s ease-out;}
.drawn-card.twist{background:#f9f0ff;border-color:var(--purple-light);}
.drawn-card.chest{background:#fff0f5;border-color:var(--pink);}
@keyframes cardFlip{from{transform:rotateY(80deg);opacity:0;}to{transform:rotateY(0);opacity:1;}}
.card-icon{font-size:34px;display:block;margin-bottom:10px;}
.modal-btns{display:flex;gap:10px;padding:0 16px 16px;flex-shrink:0;}
.draw-again-btn{flex:1;padding:13px;border-radius:50px;border:none;font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;letter-spacing:0.05em;cursor:pointer;transition:all 0.18s;}
.draw-again-btn.twist{background:linear-gradient(135deg,var(--purple),var(--purple-light));color:#fff;}
.draw-again-btn.chest{background:linear-gradient(135deg,var(--pink-dark),var(--pink));color:#fff;}
.draw-again-btn:active{transform:scale(0.97);}
.close-btn{padding:13px 20px;border-radius:50px;border:1.5px solid #fce4ec;background:#fff;font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;color:#c48090;cursor:pointer;}
.close-btn:active{background:#fce4ec;}

/* hearts bg */
.hearts-bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;}
.hbg{position:absolute;animation:hbgfloat linear infinite;opacity:0.08;}

/* FIXED ANIMATION: Animate from 0 (bottom offset) to -110vh (above top) */
@keyframes hbgfloat{
  0%{transform:translateY(0) rotate(0deg);opacity:0;}
  10%{opacity:0.15;}
  90%{opacity:0.1;}
  100%{transform:translateY(-110vh) rotate(360deg);opacity:0;}
}

/* ── DESKTOP & LANDSCAPE MEDIA QUERIES ── */
@media (min-width: 768px), (orientation: landscape) and (max-height: 600px) {
  .layout-wrapper {
    flex-direction: row;
    justify-content: center;
  }
  .board-section {
    padding: 24px;
  }
  .board {
    max-width: min(100vw - 48px, 100vh - 48px);
  }
}
</style>
</head>

</div>

<div class="bs-backdrop" id="bsBackdrop" onclick="closeBottomSheet()"></div>
<div class="bottom-sheet" id="bottomSheet">
  <div class="bs-handle"></div>
  <button class="bs-close" onclick="closeBottomSheet()">✕</button>
  <div class="bs-content" id="bsContent"></div>
</div>

<!-- CARD MODAL -->
<div class="modal-bg" id="modalBg" onclick="closeModal(event)">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-handle"></div>
    <div class="modal-header" id="modalHeader">

</div>

function buildBoardPath(){
  const p=[];
  for(let c=11;c>=1;c--) p.push({r:11,c});
  for(let r=10;r>=1;r--) p.push({r,c:1});
  for(let c=2;c<=11;c++) p.push({r:1,c});
  for(let r=2;r<=10;r++) p.push({r,c:11});
  return p;
}
const BOARD_PATH=buildBoardPath();

function tileRotation(r,c){
  if(r===1) return '180deg';if(r===11) return '0deg';
  if(c===1) return '90deg';if(c===11) return '-90deg';return '0deg';
}

function renderBoard(){
  const board=document.getElementById('board');
  board.querySelectorAll('.tile').forEach(el=>el.remove());
  const frag=document.createDocumentFragment();
  BOARD_PATH.forEach((pos,i)=>{
    const {r,c}=pos;
    const rot=tileRotation(r,c);
    const isCorner=i===0||i===10||i===20||i===30;
    const bg=TILE_BGS[i]||'#e91e63';
    if(i<BOXES.length){
      const b=BOXES[i];const id=i+1;
      const btn=document.createElement('button');
      btn.type='button';
      btn.className='tile'+(isCorner?' corner':'')+(selectedId===id?' active '+level:'');
      btn.style.gridRow=String(r);btn.style.gridColumn=String(c);
      btn.style.background=`linear-gradient(160deg,${bg} 0%,rgba(0,0,0,0.28) 100%)`;
      btn.addEventListener('click',()=>selectBox(id));
      const inner=document.createElement('div');
      inner.className='tile-inner';inner.style.setProperty('--rot',rot);
      inner.innerHTML=`<div class="tnum">#${String(id).padStart(2,'0')}</div><div class="ticon">${b.e}</div>`;
      btn.appendChild(inner);frag.appendChild(btn);
    } else {
      const div=document.createElement('div');
      div.className='tile filler'+(isCorner?' corner':'');
      div.style.gridRow=String(r);div.style.gridColumn=String(c);
      div.style.background='linear-gradient(160deg,#ba68c8,#6a1b9a)';
      const inner=document.createElement('div');inner.className='tile-inner';inner.style.setProperty('--rot',rot);
      inner.innerHTML='<div class="ticon">✨</div>';div.appendChild(inner);frag.appendChild(div);
    }
  });
  board.insertBefore(frag,board.firstChild);
}
